[tool.pytest.ini_options]
# Scope test discovery to the tests package. `scripts/test_auth_flow.py` is a
# live-server smoke script (it performs network I/O at import) and must not be
# collected by a plain `pytest` invocation.
testpaths = ["tests"]
norecursedirs = ["scripts", "html", ".venv", "logs"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["trade_post", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]